; PlatformIO Project Configuration File
; ==============================================================
; CẤU HÌNH MẶC ĐỊNH: Chọn môi trường nào chạy khi nhấn Upload
; ==============================================================
[platformio]
default_envs = test_vl53l0x_front

; ==============================================================
; ENV CHINH: Firmware day du (maze solver + line follower)
; ==============================================================
[env:esp32_main_firmware]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
; Đã bỏ upload_port và monitor_port để tự động dò tìm cổng COM
monitor_filters = esp32_exception_decoder

lib_deps =
    rfetick/MPU6050_light@^1.1.0
    pololu/VL53L0X@^1.3.1

; ==============================================================
; ENV TEST: Chỉ test VL53L0X Front độc lập (chỉ compile main.cpp)
; ==============================================================
[env:test_vl53l0x_front]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    pololu/VL53L0X@^1.3.1
    rfetick/MPU6050_light@^1.1.0

build_src_filter = +<main.cpp>

; ==============================================================
; ENV TEST ALL I2C: Test 3 VL53L0X + 1 MPU6050 cùng lúc
; ==============================================================
[env:test_all_i2c]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    pololu/VL53L0X@^1.3.1
    rfetick/MPU6050_light@^1.1.0

build_src_filter = +<test_all_i2c.cpp>

; ==============================================================
; ENV UNIT TEST: Static bench test (khong can banh xe)
; ==============================================================
[env:unit_test_sensors]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    pololu/VL53L0X@^1.3.1
    rfetick/MPU6050_light@^1.1.0

build_src_filter = +<unit_test_sensors.cpp>