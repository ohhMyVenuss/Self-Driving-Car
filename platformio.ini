; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ==============================================================
; CẤU HÌNH MẶC ĐỊNH: Chọn môi trường nào chạy khi nhấn Upload
; ==============================================================
; Đang test cảm biến -> dùng: test_vl53l0x_front
; Nạp firmware chính -> đổi thành: esp32doit-devkit-v1
[platformio]
default_envs = test_all_i2c

; ==============================================================
; ENV CHINH: Firmware day du (maze solver + line follower)
; ==============================================================
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_speed = 115200
monitor_speed = 115200
; upload_port = COM3   ; <-- BỎ COMMENT và đổi số COM cho đúng với máy bạn
; monitor_port = COM3  ; <-- BỎ COMMENT và đổi số COM cho đúng với máy bạn
; Cách tìm cổng COM: Nhấn Win+X -> Device Manager -> Ports (COM & LPT)

lib_deps =
    rfetick/MPU6050_light@^1.1.0
    pololu/VL53L0X@^1.3.1

; ==============================================================
; ENV TEST: Chỉ test VL53L0X Front độc lập (chỉ compile main.cpp)
; Cách dùng: Chọn env "test_vl53l0x_front" trong PlatformIO toolbar
;            hoặc chạy: pio run -e test_vl53l0x_front -t upload
; ==============================================================
[env:test_vl53l0x_front]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_speed = 115200
monitor_speed = 115200
; upload_port = COM3
; monitor_port = COM3

lib_deps =
    pololu/VL53L0X@^1.3.1
    rfetick/MPU6050_light@^1.1.0

; Chi compile main.cpp, bo qua maze_solver.cpp va line_follower.cpp
build_src_filter = +<main.cpp>

; ==============================================================
; ENV TEST ALL I2C: Test 3 VL53L0X + 1 MPU6050 cùng lúc
; ==============================================================
[env:test_all_i2c]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_speed = 115200
monitor_speed = 115200
; upload_port = COM3
; monitor_port = COM3

lib_deps =
    pololu/VL53L0X@^1.3.1
    rfetick/MPU6050_light@^1.1.0

build_src_filter = +<test_all_i2c.cpp>
